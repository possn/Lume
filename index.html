<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F3F1EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lume" />
  <meta name="format-detection" content="telephone=no" />
  <title>Lume — O jantar, resolvido.</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-inner">
      <div class="splash-mark" aria-hidden="true"><span></span></div>
      <div class="splash-name">Lume</div>
    </div>
  </div>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-nav="today" aria-label="Lume, início">
        <span class="brand-mark" aria-hidden="true"><span></span></span><span>Lume</span>
      </button>
      <div class="top-actions">
        <span id="aiStatus" class="ai-status" title="Estado da inteligência"><i></i><span>Local</span></span>
        <button id="installBtn" class="ghost small hidden">Adicionar</button>
      </div>
    </header>

    <main id="app" class="main"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-nav="today" class="nav-item active" aria-label="Hoje"><span class="nav-icon">⌂</span><small>Hoje</small></button>
      <button data-nav="plan" class="nav-item" aria-label="Planear"><span class="nav-icon">□</span><small>Planear</small></button>
      <button data-nav="favorites" class="nav-item" aria-label="Favoritas"><span class="nav-icon">♡</span><small>Favoritas</small></button>
      <button data-nav="history" class="nav-item" aria-label="Histórico"><span class="nav-icon">↻</span><small>Histórico</small></button>
    </nav>
  </div>

  <input id="photoInput" type="file" accept="image/*" capture="environment" hidden />
  <div id="toast" class="toast hidden"></div>
  <script src="config.js"></script>
  <script src="providers.js"></script>
  <script src="retrieval-client.js"></script>
  <script src="ai-client.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
